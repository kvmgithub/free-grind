name: Repository guard

# The server flavor's code, branding and backend live in a separate private
# repository, checked out at server/ (gitignored here; see flavors/README.md).
# Fails if any of it gets committed to this one, e.g. through `git add -f`.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-private-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No files from the private server repository
        run: |
          tracked="$(git ls-files -- server flavors/server)"
          if [ -n "$tracked" ]; then
            echo "::error::Files of the private server repository are tracked here:"
            echo "$tracked"
            exit 1
          fi
