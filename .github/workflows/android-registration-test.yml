name: Android registration test build

on:
  push:
    branches: [work/registration-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_FG_REGISTRATION_HANDOFF: 'true'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Install frontend dependencies and test the registration handoff
        run: |
          bun install --frozen-lockfile
          bun test tests/officialRegistration.test.ts
          bun run type-check
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
      - name: Install Android SDK components and Rust
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          rustup toolchain install
          rustup target add aarch64-linux-android
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Configure Android toolchain
        run: |
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          resource_dir="$("$llvm/bin/clang" -print-resource-dir)"
          {
            printf 'NDK_HOME=%s\n' "$ndk"
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk"
            printf 'BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=%s/sysroot -resource-dir=%s\n' "$llvm" "$resource_dir"
            printf 'TAURI_CONFIG=%s\n' "$(bun --no-env-file scripts/tauri-config.mjs android)"
          } >> "$GITHUB_ENV"
      - name: Build signed ARM64 debug APK
        run: |
          bunx tauri android init --ci --skip-targets-install
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            icons="src-tauri/gen/android/app/src/main/res/mipmap-$density"
            rm -f "$icons/ic_launcher.png" "$icons/ic_launcher_round.png" "$icons/ic_launcher_foreground.png"
          done
          bunx tauri android build --ci --debug --apk --split-per-abi --target aarch64
      - name: Verify application ID, ABI and signing
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='dev.estopia.free_grind.debug.registration'" "$RUNNER_TEMP/badging.txt"
          grep -F "application-label:'Free Grind Registration'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "application-debuggable" "$RUNNER_TEMP/badging.txt"
          grep -F "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
          mkdir -p artifacts
          cp "$apk" artifacts/Free-Grind-Registration-1.0.1-arm64.apk
          sha256sum artifacts/Free-Grind-Registration-1.0.1-arm64.apk
      - name: Upload installation APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: artifacts/Free-Grind-Registration-1.0.1-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
